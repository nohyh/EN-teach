services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: en_teach
      POSTGRES_USER: en_teach
      POSTGRES_PASSWORD: en_teach_dev_only
    ports:
      - "5433:5432"
    volumes:
      - en_teach_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U en_teach -d en_teach"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  en_teach_postgres:
